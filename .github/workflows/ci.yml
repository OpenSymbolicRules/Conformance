name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install just and check-jsonschema
        run: |
          sudo apt-get update && sudo apt-get install -y just
          python3 -m pip install check-jsonschema==0.38.0
      - name: Validate suites
        run: just check
